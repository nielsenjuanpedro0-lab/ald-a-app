<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: transparent; overflow: hidden; }
  .card {
    width: 100%; height: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #F6F2EA;
    border-radius: 28px;
    box-shadow: 0 20px 60px rgba(11, 33, 64, .35);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
  }
  .logo {
    width: 92px; height: 92px;
    animation: pop .6s cubic-bezier(.16, 1, .3, 1);
  }
  @keyframes pop {
    from { transform: scale(.55); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }
  .word {
    margin-top: 14px;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1.3rem;
    color: #0A6D6B;
  }
  .dots { margin-top: 12px; display: flex; gap: 5px; }
  .dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: #17B3B0;
    animation: bounce 1s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: .15s; }
  .dot:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce {
    0%, 80%, 100% { transform: translateY(0); opacity: .4; }
    40% { transform: translateY(-5px); opacity: 1; }
  }
</style>
</head>
<body>
  <div class="card">
    <img class="logo" src="logo.png" alt="AlDía">
    <div class="word">AlDía</div>
    <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  </div>
</body>
</html>
